# Gitleaks configuration for JobFinder.
#
# Why this file exists: gitleaks' default ruleset (checked at v8.21.2) contains
# NO rule for Anthropic API keys. Verified by grepping its bundled
# config/gitleaks.toml for "anthropic" — zero matches. The stock hook therefore
# detects AWS tokens and generic high-entropy strings but is blind to
# `sk-ant-...` keys, which is the exact secret type this repo leaked (see
# the product spec and the task ledger, commits 9af18b2 and 3fa4a72).
#
# Without the rule below, the pre-commit hook would give a false sense of
# protection against the only credential this project actually handles.

[extend]
# Keep every default rule (AWS, GCP, GitHub, Stripe, private keys, generic
# high-entropy assignments, ...) and add ours on top.
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-...)"
# Real keys look like sk-ant-api03-<~95 chars> and sk-ant-admin01-<...>.
# Kept deliberately broad on the suffix so a future key format still trips it.
regex = '''sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]
entropy = 3.0

[[rules.allowlists]]
description = "Placeholder and documentation strings are not real keys"
regexes = [
    # UI hint text in the Qt settings/wizard dialogs, e.g. "sk-ant-..." and
    # "sk-ant-…" placeholders shown to the user. Removed with the Qt layer in T33.
    '''sk-ant-(\.\.\.|…|xxx|XXX|your|YOUR)''',
]

[allowlist]
description = "Paths that never contain real credentials"
paths = [
    # The committed config template — must stay credential-free; CI asserts
    # that `grep -c "sk-ant-" config.example.yaml` is 0.
    '''config\.example\.yaml''',
    # Local scratch: duplicate checkouts, not part of committed content.
    '''^\.harness-worktrees/''',
    '''^\.harness/''',
]
