# Secret-scanning hook. See the product spec / the task ledger for why: config.yaml was
# git-tracked and held a real Anthropic key in history (9af18b2, 3fa4a72).
#
# THIS FILE ALONE PROVIDES NO PROTECTION. A fresh clone must run the install
# step once, or the hook never executes and commits are scanned by nothing:
#
#     pip install pre-commit
#     pre-commit install          # writes .git/hooks/pre-commit
#     pre-commit run --all-files  # one-off scan of existing content
#
# Verify it is actually live with `ls .git/hooks/pre-commit`. A present
# .pre-commit-config.yaml and an absent .git/hooks/pre-commit is the silent
# failure mode this comment exists to prevent.
#
# Rules come from .gitleaks.toml, which extends gitleaks' defaults with an
# Anthropic key rule — the stock ruleset has none, so without it this hook is
# blind to the one credential JobFinder actually handles.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
